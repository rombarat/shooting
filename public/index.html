<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSGO MVP — Browser FPS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Segoe UI", Arial, sans-serif; }
    #game { width: 100%; height: 100%; display: block; }

    .overlay { position: absolute; inset: 0; pointer-events: none; }

    /* Menu */
    #menu {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: radial-gradient(ellipse at center, #1c2733 0%, #0a0f14 100%);
      z-index: 20;
    }
    #menu h1 { color: #e8c558; font-size: 42px; letter-spacing: 4px; text-transform: uppercase; }
    #menu p { color: #8aa; max-width: 420px; text-align: center; line-height: 1.5; }
    #menu input {
      padding: 12px 16px; font-size: 18px; width: 260px; border-radius: 4px;
      border: 1px solid #3a4a5a; background: #121a22; color: #fff; outline: none; text-align: center;
    }
    #menu button {
      padding: 12px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
      background: #e8c558; color: #1a1a1a; border: none; border-radius: 4px; letter-spacing: 2px;
    }
    #menu button:hover { background: #ffd96b; }

    /* Crosshair */
    #crosshair {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 22px; height: 22px; z-index: 5;
    }
    #crosshair::before, #crosshair::after {
      content: ""; position: absolute; background: #4f4;
    }
    #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
    #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }

    /* HUD */
    #hud { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 26px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; }
    #hp { font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 0 6px #000; }
    #hp.low { color: #f44; }
    #ammo { font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 0 6px #000; }
    #ammo small { font-size: 20px; color: #aaa; }

    #teamScores {
      position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 14px; font-size: 26px; font-weight: bold; z-index: 5;
      background: rgba(0,0,0,0.45); padding: 6px 22px; border-radius: 6px;
    }
    .ct { color: #5b9bd5; } .t { color: #e8c558; }

    #killfeed { position: absolute; top: 14px; right: 16px; text-align: right; z-index: 5; }
    .feedItem {
      color: #eee; background: rgba(0,0,0,0.55); padding: 4px 10px; margin-bottom: 4px;
      border-radius: 3px; font-size: 14px;
    }

    #msg {
      position: absolute; top: 38%; left: 50%; transform: translateX(-50%);
      color: #f55; font-size: 34px; font-weight: bold; text-shadow: 0 0 10px #000; z-index: 6;
    }

    #hitmarker {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(45deg);
      width: 18px; height: 18px; border: 2px solid #fff; opacity: 0; z-index: 6;
    }

    #damageVignette {
      position: absolute; inset: 0; box-shadow: inset 0 0 140px rgba(255,0,0,0.8);
      opacity: 0; transition: opacity 0.4s; z-index: 4;
    }

    #scoreboard {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(10,15,20,0.92); border: 1px solid #345; border-radius: 8px;
      padding: 20px 30px; min-width: 440px; display: none; z-index: 15; color: #ddd;
    }
    #scoreboard table { width: 100%; border-collapse: collapse; font-size: 15px; }
    #scoreboard th, #scoreboard td { padding: 5px 12px; text-align: left; }
    #scoreboard th { color: #889; border-bottom: 1px solid #345; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="menu">
    <h1>CSGO MVP</h1>
    <p>WASD move &middot; Mouse aim &middot; Click shoot &middot; R reload &middot; Space jump &middot; Shift walk &middot; Tab scoreboard</p>
    <input id="nameInput" maxlength="16" placeholder="Your name" />
    <button id="playBtn">PLAY</button>
    <p id="menuStatus"></p>
  </div>

  <div class="overlay">
    <div id="damageVignette"></div>
    <div id="crosshair" style="display:none"></div>
    <div id="hitmarker"></div>
    <div id="teamScores" style="display:none">
      <span class="ct">CT <span id="ctScore">0</span></span>
      <span style="color:#666">:</span>
      <span class="t"><span id="tScore">0</span> T</span>
    </div>
    <div id="killfeed"></div>
    <div id="msg"></div>
    <div id="hud" style="display:none">
      <div id="hp">100</div>
      <div id="ammo">30 <small>/ &infin;</small></div>
    </div>
    <div id="scoreboard">
      <table>
        <thead><tr><th>Player</th><th>Team</th><th>K</th><th>D</th></tr></thead>
        <tbody id="scoreRows"></tbody>
      </table>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="/game.js"></script>
</body>
</html>
